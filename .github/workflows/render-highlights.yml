name: Render Highlights Reel

# Triggered on demand — either from the "Regenerate Highlights Reel" button
# in the site's admin Settings tab (which calls the workflow_dispatch API
# with the admin's PAT) or manually via `gh workflow run` — or on the
# Tuesday schedule below, which auto-publishes unattended (see the
# "Publish (scheduled runs only)" step). The on-demand paths still don't
# auto-publish: rendering on every live-editor edit was retired in favor of
# explicit owner control.
on:
  workflow_dispatch:
  # Tuesday 09:00 UTC = 12:00 Jordan time (GMT+3, no DST) — see the
  # "Publish (scheduled runs only)" step below for why only this trigger
  # auto-publishes.
  schedule:
    - cron: '0 9 * * 2'

permissions:
  contents: write
  actions: write   # needed to dispatch deploy.yml explicitly — see below

# Scheduled (Tuesday) runs commit, push, and dispatch deploy.yml via the
# "Publish (scheduled runs only)" step at the end of the job. On-demand
# (workflow_dispatch) runs still don't commit or push anything — that stays
# a manual Control Station step (see the note at the end of the job below).
# Either way, two renders still shouldn't run concurrently on the same
# self-hosted machine: they'd trample each other's remotion/out/ files and
# GPU. Only one render at a time; later triggers wait rather than run
# concurrently.
concurrency:
  group: render-highlights
  cancel-in-progress: false

jobs:
  render:
    # Rendered on the owner's own PC (i9-14900HX / RTX 4070 / 32GB) via a
    # self-hosted runner instead of GitHub's 2-vCPU, GPU-less ubuntu-latest
    # — the Render step is the bottleneck and this hardware is dramatically
    # faster at it. Only this job moved; deploy.yml stays on ubuntu-latest
    # since the site deploy shouldn't depend on this specific PC being on.
    #
    # Note the GPU earns its place at the web-encode step (ffmpeg-static has
    # h264_nvenc) rather than the render: Remotion's bundled ffmpeg has no
    # NVENC, and encoding is under 1% of this job's wall-clock anyway. The
    # render itself is Chromium drawing WebGL frames, which no encoder
    # setting touches. Quality/format knobs live in render-settings.json;
    # no --hardware-acceleration flag here, so that file stays authoritative.
    runs-on: [self-hosted, windows, museum-render]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # public/highlights*.mp4 and the poster jpg are tracked via Git LFS
      # (.gitattributes) so repeated regenerations don't keep bloating repo
      # history with full-size binary blobs, and so a future higher-quality
      # render can exceed GitHub's 100MB plain-git per-file block. Idempotent
      # — safe to run even if this runner already has LFS configured.
      - name: Ensure Git LFS is set up
        run: git lfs install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The live editor stores fresh screenshots as base64 inside
      # projects.js — materialize them to real files here (not committed;
      # deploy.yml owns that commit) so the reel always has real image
      # paths to render, regardless of whether deploy.yml has run yet.
      - name: Install site dependencies
        run: npm ci

      - name: Extract embedded images (local only, not committed)
        run: node scripts/extract-images.mjs

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci

      - name: Fetch live stats (guestbook + appreciations)
        working-directory: remotion
        run: npm run fetch-stats
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Automated editorial pass: reviews the real project content (incl.
      # cover images) and picks which projects star, section on/off toggles,
      # photos-per-project, and a fitting music track — written into
      # reel-config.json/render-settings.json BEFORE Select score runs, so
      # select-score.mjs picks up any pinned track through its existing
      # path. Runs a headless `claude` CLI invocation using whatever Claude
      # Code login is already active on this self-hosted runner (the
      # owner's own PC) — no API key/secret needed. Never fails the render:
      # on any error (CLI missing/not logged in, malformed output) it
      # leaves today's defaults (random track, featured-first order) in
      # place. See remotion/scripts/agent-edit.mjs.
      - name: Run editing agent
        working-directory: remotion
        run: npm run agent-edit

      # Picks a track from music/cinematic/ and the window of it the reel is
      # cut against: long enough for the reel, starting on a downbeat, and
      # scored on its musical arc rather than chosen at random. Also emits
      # beat-map.json, which is what lets the next step lock the cut to the
      # bar grid. Reads the committed analyses in music/analysis/ — it never
      # analyses audio here, so a render can't be derailed by beat detection
      # going wrong unattended. See scripts/select-score.mjs.
      # (The editing agent above may already have pinned a track.)
      - name: Select score
        working-directory: remotion
        run: npm run select-score

      # Decide the cut (edl.json) from the reel data, then check it against
      # the invariants that would otherwise surface as a crashed render or a
      # silently wrong video — including that the reel doesn't outlast its
      # own soundtrack. Cheap, and it runs before the expensive part.
      - name: Build edit decision list
        working-directory: remotion
        run: npm run build-edl

      - name: Verify edit decision list
        working-directory: remotion
        run: npm run verify-edl

      - name: Render (16:9 master)
        working-directory: remotion
        run: npm run render

      - name: Render (9:16 vertical master)
        working-directory: remotion
        run: npx remotion render src/index.jsx HighlightsReelVertical out/highlights-vertical.mp4

      # A settled frame from the title slide — the site modal's poster, so
      # the (preload=none) player shows the reel's cover instead of black.
      - name: Render poster frame
        working-directory: remotion
        run: npx remotion still src/index.jsx HighlightsReel out/highlights-poster.jpg --frame=80

      # Visitors get the web encode (CRF 22 + faststart, a fraction of the
      # size); the CRF-14 masters go to workflow artifacts instead of
      # bloating the repo and every visitor's connection.
      - name: Web-encode for delivery
        working-directory: remotion
        shell: 'C:\PROGRA~1\Git\usr\bin\bash.exe -e -o pipefail {0}'
        run: |
          node scripts/web-encode.mjs out/highlights.mp4 out/highlights-web.mp4
          node scripts/web-encode.mjs out/highlights-vertical.mp4 out/highlights-vertical-web.mp4

      # QA pass on the rendered master — advisory only (see remotion/scripts/agent-review.mjs).
      # Same headless `claude` CLI approach as the editing agent above, no
      # API key needed. Never fails the render or blocks publishing; the
      # report just sits alongside the video for the human review step below.
      - name: Run QA review
        working-directory: remotion
        run: npm run agent-review

      - name: Archive full-quality masters
        uses: actions/upload-artifact@v4
        with:
          name: highlights-masters
          path: |
            remotion/out/highlights.mp4
            remotion/out/highlights-vertical.mp4
          retention-days: 90

      # Only the unattended Tuesday run publishes automatically — there's
      # no owner present to glance at the editing agent's picks (project
      # selection/order, music) the way the on-demand flow's Control
      # Station review does. workflow_dispatch runs (the admin's
      # "Regenerate" button, or a manual `gh workflow run`) still stop
      # after the QA review/artifact-upload steps above and don't publish.
      # Sequence mirrors remotion/control-station/lib/gitPublish.mjs's
      # publish() exactly, including tolerating a stale/failed ref-catchup
      # poll rather than aborting before the deploy dispatch.
      - name: Publish (scheduled runs only)
        if: github.event_name == 'schedule'
        shell: 'C:\PROGRA~1\Git\usr\bin\bash.exe -e -o pipefail {0}'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git lfs install
          git fetch origin main
          git reset --hard origin/main
          cp remotion/out/highlights-web.mp4 public/highlights.mp4
          cp remotion/out/highlights-vertical-web.mp4 public/highlights-vertical.mp4
          cp remotion/out/highlights-poster.jpg public/highlights-poster.jpg
          git add public/highlights.mp4 public/highlights-vertical.mp4 public/highlights-poster.jpg
          if git diff --cached --quiet; then
            echo "No changes to publish (output identical to what's already live)."
            exit 0
          fi
          git commit -m "chore: regenerate highlights reel (scheduled)"
          git push origin HEAD:main
          NEW_SHA=$(git rev-parse HEAD)
          for i in $(seq 1 15); do
            REMOTE_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha || true)
            if [ "$REMOTE_SHA" = "$NEW_SHA" ]; then break; fi
            sleep 2
          done
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      # Only workflow_dispatch runs intentionally stop here without
      # publishing. The editing agent above makes real creative calls
      # (project selection/order, section toggles, music) worth a human
      # glance before they go live on demand, so for those runs publishing
      # is a separate, explicit step done from the Control Station
      # (remotion/control-station) on this same machine — the self-hosted
      # runner IS the owner's own PC, so the rendered files in
      # remotion/out/ (plus agent-edit.json and agent-review.json) are
      # already sitting where Control Station reads them. Open it, review
      # the editor's decisions and QA verdict, watch the preview, and hit
      # Publish when ready. Scheduled (Tuesday) runs skip this manual
      # review entirely and publish automatically via the step above.
